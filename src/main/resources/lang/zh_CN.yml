reward-pending: '<#F38BA8>⚠ 背包空间不足：<#FAB387>奖励记录已妥善保留，请清理背包后联系管理员核对。'
script-welcome: '<#A6E3E1>💡 提示：<#CDD6F4>击败所有守卫，然后右键点击祭坛即可完成副本！'
exit-failed: '<#F38BA8>✖ 传送失败：<#E78284>返回失败，已保留副本绑定状态，请稍后重试退出。'
