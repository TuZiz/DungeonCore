schema-version: 1
help:
  player:
    - '<#A6E3E1>✦ Dungeon · 副本帮助'
    - '<#9399B2>〈参数〉必填，[参数]可选；带队进入请由队长操作。'
    - '<#89B4FA>/dungeon lobby <#CDD6F4>— 前往无怪物副本大厅'
    - '<#89B4FA>/dungeon list <#CDD6F4>— 查看可进入的副本 ID'
    - '<#89B4FA>/dungeon enter 〈副本ID〉 [难度] <#CDD6F4>— 单人或带队进入，默认 normal'
    - '<#89B4FA>/dungeon exit <#CDD6F4>— 退出副本并返回进入前的位置'
    - '<#89B4FA>/dungeon status <#CDD6F4>— 查看当前实例、阶段与进度'
    - '<#89B4FA>/dungeon help party <#CDD6F4>— 查看组队指令'
  party:
    - '<#A6E3E1>✦ Dungeon · 组队帮助'
    - '<#89B4FA>/dungeon party invite 〈玩家〉 <#CDD6F4>— 邀请在线玩家，邀请 60 秒有效'
    - '<#89B4FA>/dungeon party accept <#CDD6F4>— 接受最近的队伍邀请'
    - '<#89B4FA>/dungeon party leave <#CDD6F4>— 离开队伍；队长离开将解散队伍'
    - '<#9399B2>调整队伍前请先退出副本；队长使用 enter 带队进入。'
  admin:
    - '<#F9E2AF>✦ Dungeon · 管理帮助'
    - '<#89B4FA>/dungeon create 〈ID〉 <#CDD6F4>— 从示例创建配置目录，不会建设地图'
    - '<#89B4FA>/dungeon validate [ID] <#CDD6F4>— 校验指定或全部已加载副本，不应用改动'
    - '<#89B4FA>/dungeon reload [ID] <#CDD6F4>— 重载副本配置；已有实例继续使用原配置'
    - '<#89B4FA>/dungeon test 〈ID〉 [难度] <#CDD6F4>— 玩家单人实测，会刷怪并发放奖励'
    - '<#89B4FA>/dungeon debug <#CDD6F4>— 查看当前实例的世界、状态与计数'
    - '<#9399B2>test/debug 需玩家执行。reload 仅更新副本定义，不重载大厅或语言。'
help-admin-hint: '<#F9E2AF>管理指令：<#89B4FA>/dungeon help admin'
unknown-command: '<#F38BA8>未知子指令，请参考以下帮助或使用 Tab 补全。'
player-only: '<#F9E2AF>该指令需要玩家在游戏内执行。'
usage:
  help: '<#F9E2AF>用法：/dungeon help [player|party|admin]'
  lobby: '<#F9E2AF>用法：/dungeon lobby'
  list: '<#F9E2AF>用法：/dungeon list'
  enter: '<#F9E2AF>用法：/dungeon enter 〈副本ID〉 [难度]，默认 normal'
  exit: '<#F9E2AF>用法：/dungeon exit'
  status: '<#F9E2AF>用法：/dungeon status'
  create: '<#F9E2AF>用法：/dungeon create 〈副本ID〉'
  reload: '<#F9E2AF>用法：/dungeon reload [副本ID]'
  validate: '<#F9E2AF>用法：/dungeon validate [副本ID]'
  test: '<#F9E2AF>用法：/dungeon test 〈副本ID〉 [难度]'
  debug: '<#F9E2AF>用法：/dungeon debug'
permission: '<#F38BA8>✖ 权限不足：<#E78284>你没有使用该指令的权限。'
invalid: '<#F38BA8>✖ 操作无效：<#E78284>条件未满足，请检查参数、队伍人数、难度或副本占用状态。'
config-error: '<#F38BA8>✖ 配置异常：<#E78284>校验失败，已自动保留旧快照。请查看控制台文件与路径诊断。'
list: '<#A6E3E1>✦ 可用副本列表 ✦\n<detail>'
status: '<#A6E3E1>✦ 副本状态信息 ✦\n<detail>'
ok: '<#A6E3E1>✔ <#A6E3E1>操作成功完成。'
invite: '<#FAB387>✦ 组队邀请 ✦ <#89B4FA><detail> <#FAB387>邀请你加入队伍，请在 <#F9E2AF>60秒内 <#FAB387>使用 <#89B4FA>/dungeon party accept <#FAB387>加入。'
entered: '<#A6E3E1>⚔ <#A6E3E1>副本已正式开启，祝君武运昌隆！'
left: '<#9399B2>➜ 你已安全退出副本。'
