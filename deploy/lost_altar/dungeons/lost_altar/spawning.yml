# Dungeon 负责刷新位置、数量和回收；怪物定义、技能、掉落仍使用 MythicMobs。
schema-version: 1
enabled: true
# 每个玩家每轮最多尝试 3 个位置，每 50 tick（2.5 秒）一轮。
interval-ticks: 50
attempts: 3
radius:
  min: 12
  max: 24
# 搜索距离上限；同时受 height 的玩家相对高度限制。
vertical-search: 12
# 怪物脚部最多高于玩家 2 格、低于玩家 6 格；找不到安全落点就跳过。
height:
  above: 2
  below: 6
player-separation: 8
# 未启用下方矩形时使用此圆形安全区半径（格）；0 为关闭。
spawn-safe-radius: 0
limits:
  # 总数量包含精英；附近上限供聚集的玩家共享。
  per-player: 10
  nearby: 16
  elites-per-player: 1
  elites-nearby: 2
despawn:
  radius: 80
  after-seconds: 10
mobs:
  - id: '苔痕行尸'
    name: '苔痕行尸'
    weight: 20
    elite: false
  - id: '潮蚀遗民'
    name: '潮蚀遗民'
    weight: 20
    elite: false
  - id: '遗坛弓卫'
    name: '遗坛弓卫'
    weight: 20
    elite: false
  - id: '藤影猎蛛'
    name: '藤影猎蛛'
    weight: 20
    elite: false
  - id: '石誓守卫'
    name: '石誓守卫'
    weight: 5
    elite: true
  - id: '符文守祭者'
    name: '符文守祭者'
    weight: 5
    elite: true
  - id: '杀手兔'
    name: '杀手兔'
    weight: 5
    elite: true
  - id: '荆棘妖花'
    name: '荆棘妖花'
    # 稀有模型精英；仍占现有精英上限，不提高整体刷新频率。
    weight: 2
    elite: true
    model: 'briarqueen_rose'
    # 模型约 2.25 格高，要求脚部上方至少 3 格净空。
    headroom: 3

# 安全区使用包含端点的方块坐标；高度按入口地形设置，区外正常战斗。
safe-zone:
  enabled: true
  min:
    x: -164
    y: 0
    z: 155
  max:
    x: -124
    y: 24
    z: 186
